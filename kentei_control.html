<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101A33">
<title>川西モルック検定RTA 操作</title>
<style>
  :root { --navy: #101A33; --navy2: #1B284A; --hud: #2B3450; --red: #E01F33; --gold: #F0B429; --white: #F5F6FA; --gray: #8A93AB; --line: #4A5575; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--navy); color: var(--white); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; color: inherit; }
  button:disabled { opacity: .35; cursor: default; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--gray); }
  .conn.ok { color: #6fd39a; } .conn.ng { color: var(--gold); }
  .time { font-size: 54px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; margin: 6px 0 2px; letter-spacing: -1px; }
  .time.wait { color: var(--gray); } .time.goal { color: var(--gold); }
  .sub { text-align: center; color: var(--gray); font-size: 14px; font-weight: 700; }
  .card { background: var(--hud); border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .g { display: flex; align-items: baseline; gap: 10px; }
  .g b { font-size: 40px; color: var(--gold); font-weight: 900; }
  .g span { font-size: 22px; font-weight: 900; }
  .g i { margin-left: auto; font-style: normal; color: var(--gray); font-weight: 800; }
  .cond { color: var(--gray); font-size: 13px; margin-top: 2px; }
  .slots { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; margin-top: 12px; }
  .slot { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; }
  .slot.c { background: var(--gold); border-color: var(--gold); color: var(--navy); } .slot.c::before { content: "○"; }
  .slot.m { background: var(--red); border-color: var(--red); } .slot.m::before { content: "✕"; }
  .slot.next { border-color: var(--white); }
  .count { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 10px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .count b { color: var(--gold); font-size: 24px; }
  .note.warn { color: var(--gold); } .note.pass { color: var(--gold); } .note.fail { color: var(--red); }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .big button { height: 150px; font-size: 64px; font-weight: 900; }
  .ok { background: var(--gold); color: var(--navy); }
  .ng { background: var(--red); color: #fff; }
  .wide { width: 100%; height: 72px; font-size: 22px; font-weight: 900; margin-top: 12px; }
  .wide.go { background: var(--gold); color: var(--navy); }
  .wide.retry { background: var(--red); color: #fff; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; height: 50px; background: var(--navy2); border: 2px solid var(--line); font-weight: 800; font-size: 15px; }
  h2 { font-size: 15px; color: var(--gold); margin-bottom: 8px; }
  details { margin-top: 12px; background: var(--navy2); border-radius: 14px; padding: 12px 14px; }
  summary { font-weight: 800; cursor: pointer; }
  .set { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; flex-wrap: wrap; }
  .set label { display: flex; align-items: center; gap: 6px; }
  .set input[type=text], .set input[type=time], .set select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--navy); color: var(--white); }
  .set button { padding: 8px 14px; background: var(--hud); border: 2px solid var(--line); font-weight: 800; }
  .set button.danger { border-color: var(--red); color: var(--red); }
  .log { font-size: 13px; line-height: 1.7; color: var(--white); white-space: pre-wrap; font-variant-numeric: tabular-nums; }
  .hint { color: var(--gray); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  a { color: var(--gold); }
</style>
</head>
<body>
<div class="top"><span>川西モルック検定 RTA 操作</span><span id="conn" class="conn"></span></div>
<div id="time" class="time"></div>
<div id="sub" class="sub"></div>
<div id="main"></div>

<div class="row">
  <button id="undo">↶ 1つ戻す</button>
</div>

<details>
  <summary>表示・音</summary>
  <div class="set">
    <label><input type="checkbox" data-show="timer"> タイマー</label>
    <label><input type="checkbox" data-show="hud"> 今の級</label>
    <label><input type="checkbox" data-show="progress"> 級の進み</label>
  </div>
  <div class="set">
    <label><input type="checkbox" data-sfx="control"> この端末で音</label>
    <label><input type="checkbox" data-sfx="overlay"> オーバーレイで音</label>
  </div>
  <p class="hint">PRISM Liveなどのスマホ録画はWebページの音を拾えない。音を録画に入れたいときは「この端末で音」をONにしてマイクの近くで鳴らすか、編集で後から入れる。</p>
</details>

<details>
  <summary>記録（級ごとのタイム）</summary>
  <div id="log" class="log"></div>
  <div class="set"><button id="copy">テキストでコピー</button></div>
</details>

<details>
  <summary>設定・直す</summary>
  <div class="set">ルーム名 <input id="room" type="text" placeholder="例: kentei" style="width:140px"> <button id="roomSave">保存して再読込</button></div>
  <p class="hint">オーバーレイ側は <span id="ovUrl"></span> を開く（同じルーム名で同期）。</p>
  <div class="set">開始時刻を直す <input id="startAt" type="time" step="1"> <button id="startSet">直す</button></div>
  <div class="set">級を直す <select id="jump"></select> <button id="jumpSet">この級にする</button></div>
  <p class="hint">「級を直す」は押し間違いの修正用。それより上の級は合格扱いのまま、下の級の合格は消える。</p>
  <div class="set"><button id="reset" class="danger">全部リセット</button></div>
</details>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="kentei.js?v=1"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let S = loadState();

  // ── 効果音（この端末） ──
  const SOUNDS = makeSounds(["throw_clear", "throw_miss", "start"]);
  function playSfx(name) {
    if (!S.sfx.control || !SOUNDS[name]) return;
    const a = SOUNDS[name].cloneNode();
    a.volume = Math.max(0, Math.min(1, S.sfx.vol));
    a.play().catch(() => {});
  }

  // ── 取り消し用の履歴（この端末だけ） ──
  const UNDO_KEY = "kentei_rta_undo";
  let undoStack = [];
  try { undoStack = JSON.parse(localStorage.getItem(UNDO_KEY)) || []; } catch (e) {}
  function commit(mut) {
    undoStack.push(JSON.stringify(S));
    if (undoStack.length > 100) undoStack.shift();
    try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); } catch (e) {}
    mut();
    saveState(S);
    render();
  }
  const fx = (type, text, sub) => { S.fx = { type, text, sub, t: Date.now() }; };

  // ── 操作 ──
  function start() {
    commit(() => { S.start = Date.now(); S.stop = 0; fx("go", "START", "川西モルック検定 RTA　12級から"); });
    playSfx("start");
  }

  function mark(v) {
    if (!S.start || S.stop || tally(S.log).st !== "play") return;
    commit(() => {
      S.log.push(v);
      const t = tally(S.log), gi = gradeInfo(S.grade), now = elapsed(S);
      if (t.st === "pass") {
        S.done[S.grade] = now;
        S.hist.push({ g: S.grade, try: S.tries[S.grade] || 1, log: S.log.slice(), r: "pass", at: now });
        if (S.grade === 1) { S.stop = S.start + now; fx("big final", "COMPLETE!", `川西モルック検定 全12級クリア　${fmtTime(now)}`); }
        else fx("", "CLEAR!", `${S.grade}級 ${gi.name} 合格${S.grade === 5 ? "（川西モルックの会 入会資格）" : ""}　${fmtTime(now)}`);
      } else if (t.st === "fail") {
        S.hist.push({ g: S.grade, try: S.tries[S.grade] || 1, log: S.log.slice(), r: "fail", at: now });
        fx("fail", "FAILED", `${S.grade}級 ${S.tries[S.grade] || 1}回目 不合格（${t.c}/7）`);
      }
    });
    playSfx(v === "c" ? "throw_clear" : "throw_miss");
  }

  function next() {
    commit(() => {
      S.grade -= 1; S.log = []; S.tries[S.grade] = S.tries[S.grade] || 1;
      fx("go", `${S.grade}級`, gradeInfo(S.grade).name);
    });
  }

  function retry() {
    commit(() => {
      S.log = []; S.tries[S.grade] = (S.tries[S.grade] || 1) + 1;
      fx("go", `${S.grade}級`, `${S.tries[S.grade]}回目　${gradeInfo(S.grade).name}`);
    });
  }

  function undo() {
    if (!undoStack.length) return;
    S = normalize(JSON.parse(undoStack.pop()));
    S.fx = null;
    try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); } catch (e) {}
    saveState(S);
    render();
  }

  // ── 表示 ──
  function render() {
    const ms = elapsed(S), t = tally(S.log), gi = gradeInfo(S.grade);
    $("time").className = `time ${!S.start ? "wait" : S.stop ? "goal" : ""}`;
    $("time").textContent = fmtTime(ms);
    $("sub").textContent = S.stop ? "全級クリア！" : S.start ? `合格 ${Object.keys(S.done).length} / 12` : "スタート前";

    let html = "";
    if (!S.start) {
      html = `<button class="wide go" id="bStart" style="height:110px;font-size:30px">▶ スタート</button>
        <p class="hint">押した瞬間からタイマーが動く。止めるのは1級合格のときだけ。</p>`;
    } else {
      const slots = Array.from({ length: THROWS }, (_, i) => `<div class="slot ${S.log[i] || (i === S.log.length && t.st === "play" ? "next" : "")}"></div>`).join("");
      const missLeft = MAX_MISS - t.m;
      const note = t.st === "pass" ? "合格！" : t.st === "fail" ? "不合格" : missLeft === 0 ? "もうミスできない" : `あと${t.left}本・ミス残り${missLeft}`;
      const ncls = t.st === "pass" ? "pass" : t.st === "fail" ? "fail" : missLeft <= 1 ? "warn" : "";
      html = `<div class="card">
          <div class="g"><b>${S.grade}級</b><span>${gi.name}</span><i>${S.tries[S.grade] || 1}回目</i></div>
          <div class="cond">${gi.cond}</div>
          <div class="slots">${slots}</div>
          <div class="count"><span><b>${t.c}</b> / 7 成功（${t.n}投）</span><span class="note ${ncls}">${note}</span></div>
        </div>`;
      if (S.stop) html += `<button class="wide go" disabled>🏆 ゴール ${fmtTime(ms)}</button>`;
      else if (t.st === "pass") html += `<button class="wide go" id="bNext">次へ → ${S.grade - 1}級 ${gradeInfo(S.grade - 1).name}</button>`;
      else if (t.st === "fail") html += `<button class="wide retry" id="bRetry">もう一度 → ${S.grade}級 ${(S.tries[S.grade] || 1) + 1}回目</button>`;
      else html += `<div class="big"><button class="ok" id="bOk">○</button><button class="ng" id="bNg">✕</button></div>`;
    }
    $("main").innerHTML = html;
    const on = (id, f) => { const b = $(id); if (b) b.onclick = f; };
    on("bStart", start); on("bOk", () => mark("c")); on("bNg", () => mark("m")); on("bNext", next); on("bRetry", retry);
    $("undo").disabled = !undoStack.length;

    document.querySelectorAll("[data-show]").forEach((c) => { c.checked = !!S.show[c.dataset.show]; });
    document.querySelectorAll("[data-sfx]").forEach((c) => { c.checked = !!S.sfx[c.dataset.sfx]; });
    $("log").textContent = logText() || "まだ記録なし";
  }

  function logText() {
    const lines = [];
    if (S.start) lines.push(`スタート ${new Date(S.start).toLocaleTimeString("ja-JP")}`);
    for (const h of S.hist) {
      lines.push(`${String(h.g).padStart(2, " ")}級 ${h.try}回目 ${h.r === "pass" ? "合格" : "不合格"}  ${fmtTime(h.at)}  ${h.log.map((x) => (x === "c" ? "○" : "✕")).join("")}`);
    }
    if (S.stop) lines.push(`ゴール ${fmtTime(elapsed(S))}`);
    return lines.join("\n");
  }

  // ── 設定 ──
  document.querySelectorAll("[data-show]").forEach((c) => c.onchange = () => commit(() => { S.show[c.dataset.show] = c.checked; }));
  document.querySelectorAll("[data-sfx]").forEach((c) => c.onchange = () => commit(() => { S.sfx[c.dataset.sfx] = c.checked; }));
  $("undo").onclick = undo;
  $("copy").onclick = () => navigator.clipboard.writeText(logText()).then(() => alert("コピーした"), () => alert("コピーできなかった"));

  $("room").value = ROOM;
  const ovUrl = new URL("kentei.html", location.href);
  if (ROOM) ovUrl.searchParams.set("room", ROOM);
  $("ovUrl").innerHTML = `<a href="${ovUrl}" target="_blank">${ovUrl}</a>`;
  $("roomSave").onclick = () => {
    const r = $("room").value.replace(/[^\w-]/g, "");
    try { localStorage.setItem(K_ROOM, r); } catch (e) {}
    const u = new URL(location.href);
    if (r) u.searchParams.set("room", r); else u.searchParams.delete("room");
    location.href = u;
  };

  $("startSet").onclick = () => {
    const v = $("startAt").value; if (!v) return;
    const [h, m, s] = v.split(":").map(Number);
    const d = new Date(); d.setHours(h, m, s || 0, 0);
    if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1);
    if (!confirm(`開始時刻を ${d.toLocaleString("ja-JP")} にする？`)) return;
    commit(() => { const ms = elapsed(S); S.start = d.getTime(); if (S.stop) S.stop = S.start + ms; });
  };

  $("jump").innerHTML = GRADES.map((x) => `<option value="${x.g}">${x.g}級 ${x.name}</option>`).join("");
  $("jumpSet").onclick = () => {
    const g = +$("jump").value;
    if (!confirm(`${g}級からやり直し状態にする？（${g}級以下の合格は消える）`)) return;
    commit(() => {
      for (const k of Object.keys(S.done)) if (+k <= g) delete S.done[k];
      for (const x of GRADES) if (x.g > g && S.done[x.g] == null) S.done[x.g] = elapsed(S);
      S.grade = g; S.log = []; S.stop = 0; S.tries[g] = S.tries[g] || 1; S.fx = null;
    });
  };

  $("reset").onclick = () => {
    if (!confirm("タイマーも記録も全部消す？")) return;
    if (!confirm("本当に消す？（戻せない）")) return;
    const keep = { show: S.show, sfx: S.sfx };
    S = Object.assign(blankState(), keep);
    undoStack = []; try { localStorage.removeItem(UNDO_KEY); } catch (e) {}
    saveState(S); render();
  };

  // ── 接続表示・同期 ──
  const showConn = () => { $("conn").textContent = ROOM ? `ルーム ${ROOM}：${fbStatus}` : "同期オフ（ルーム名なし）"; $("conn").className = `conn ${fbStatus === "接続OK" ? "ok" : ROOM ? "ng" : ""}`; };
  fbStatusCbs.push(showConn); showConn();
  onState((ns) => { S = ns; render(); });
  render();
  setInterval(() => { if (S.start && !S.stop) $("time").textContent = fmtTime(elapsed(S)); }, 250);
</script>
</body>
</html>
