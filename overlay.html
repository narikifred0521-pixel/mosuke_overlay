<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MöSUKE Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,700;1,800;1,900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #101A33; --navy2: #1B284A; --hud: #2B3450; --dark: #0A1022;
    --red: #E01F33; --gold: #F0B429; --white: #F5F6FA; --gray: #8A93AB; --line: #4A5575;
    --jp: "Hiragino Sans", "Noto Sans JP", sans-serif;
    --en: "Barlow", "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: var(--jp); color: var(--white); position: relative; }
  body.bg { background: linear-gradient(160deg, #4d6b3c 0%, #7c9a5a 45%, #a9b980 70%, #c9c9a0 100%); }
  body.bg::after { content: "（プレビュー用の仮背景）"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 40px; color: rgba(255,255,255,.35); font-weight: 800; z-index: -1; }
  .en { font-family: var(--en); font-style: italic; font-weight: 900; }
  .layer { position: absolute; transition: opacity .35s, transform .45s cubic-bezier(.2,.9,.2,1); }
  .layer.hide { opacity: 0; pointer-events: none; }

  /* ── HUD（右下）: 種目名＋クリア/ミス ── */
  #hud { right: 40px; bottom: 40px; width: 660px; background: var(--hud); border-radius: 22px;
    padding: 22px 32px 26px 36px; box-shadow: 0 10px 30px rgba(0,0,0,.35); overflow: hidden; }
  #hud.hide { transform: translateX(40px); }
  #hud::before { content: ""; position: absolute; left: 0; top: 22px; width: 11px; height: 64px; background: var(--red); }
  .hud-title { display: flex; align-items: baseline; gap: 16px; height: 64px; }
  .hud-id { flex-shrink: 0; white-space: nowrap; color: var(--gold); font-size: 60px; line-height: 1; letter-spacing: -1px; }
  .hud-name { font-size: 42px; font-weight: 800; white-space: nowrap; }
  .hud-kind { margin-left: auto; font-size: 20px; color: var(--gray); font-weight: 700; white-space: nowrap; }
  .hud-row { display: flex; align-items: center; margin-top: 16px; min-height: 52px; }
  .hud-label { width: 115px; font-size: 30px; font-weight: 800; color: var(--gray); }
  .chips { display: flex; gap: 12px; }
  .chip { height: 50px; min-width: 88px; padding: 0 16px; border-radius: 10px; border: 3px solid var(--white);
    display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 32px; font-weight: 900; transition: all .3s; }
  .chip.done { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .chip.done::before { content: "✓"; font-size: 28px; }
  .chip.pop { animation: pop .5s; }
  .miss-dots { display: flex; gap: 12px; }
  .dot { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--line); display: flex;
    align-items: center; justify-content: center; font-size: 26px; font-weight: 900; transition: all .3s; }
  .dot.on { background: var(--red); border-color: var(--red); }
  .dot.on::before { content: "✕"; color: #fff; }
  .dot.pop { animation: pop .5s; }
  .hud-note { margin-left: auto; font-size: 30px; font-weight: 800; white-space: nowrap; }
  .hud-note.warn { color: var(--gold); }
  .hud-note.clear { color: var(--gold); }
  .hud-note.fail { color: var(--red); }
  #hud.st-clear { box-shadow: 0 0 0 4px var(--gold), 0 10px 30px rgba(0,0,0,.35); }
  #hud.st-fail { box-shadow: 0 0 0 4px var(--red), 0 10px 30px rgba(0,0,0,.35); }

  body.hud-tl #hud { right: auto; bottom: auto; left: 40px; top: 40px; }
  body.hud-tl #hud.hide { transform: translateX(-40px); }
  /* Final用HUD */
  .fin-wrap { display: flex; align-items: flex-end; gap: 26px; margin-top: 14px; }
  .fin-time { font-size: 92px; line-height: .9; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .fin-time.warn { color: var(--gold); }
  .fin-time.over { color: var(--red); }
  .fin-limit { font-size: 26px; color: var(--gray); font-weight: 800; padding-bottom: 8px; }
  .bar { position: relative; height: 14px; background: var(--navy); border-radius: 7px; margin-top: 12px; overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 8px; transition: width .2s linear; }
  .bar.time > i { background: var(--white); }
  .bar.time.warn > i { background: var(--gold); }
  .bar.time.over > i { background: var(--red); }
  .fin-score { white-space: nowrap; display: flex; align-items: baseline; gap: 10px; }
  .fin-score b { font-size: 68px; color: var(--gold); line-height: 1; }
  .fin-score span { font-size: 34px; color: var(--gray); }

  /* ── 進行バー（右上） ── */
  #progress { right: 40px; top: 40px; display: flex; align-items: center; gap: 18px; background: rgba(16,26,51,.92);
    border-radius: 18px; padding: 14px 24px 14px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #progress.hide { transform: translateX(40px); }
  #progress img { height: 64px; }
  .stg { display: flex; flex-direction: column; gap: 6px; }
  .stg-name { font-size: 20px; color: var(--gray); letter-spacing: .5px; }
  .stg.cur .stg-name { color: var(--gold); }
  .stg.final .stg-name { color: var(--red); }
  .pips { display: flex; gap: 6px; }
  .pip { width: 26px; height: 26px; border-radius: 6px; background: var(--navy2); border: 2px solid var(--line); transition: all .3s; }
  .pip.clear { background: var(--gold); border-color: var(--gold); }
  .pip.fail { background: var(--red); border-color: var(--red); }
  .pip.cur { border-color: var(--white); animation: blink 1.2s infinite; }
  .stg-sep { width: 2px; height: 46px; background: var(--line); }

  /* ── 選手ロワーサード（左下） ── */
  #player { left: 0; bottom: 60px; width: 900px; height: 170px; }
  #player.hide { transform: translateX(-80px); }
  .pl-box { position: absolute; left: 0; top: 0; width: 860px; height: 150px; background: var(--navy);
    clip-path: polygon(0 0, 100% 0, calc(100% - 50px) 100%, 0 100%); display: flex; align-items: center; }
  .pl-no { width: 190px; height: 100%; background: var(--red); display: flex; align-items: center; justify-content: center;
    clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%); font-size: 110px; padding-right: 20px; letter-spacing: -3px; }
  .pl-text { padding-left: 28px; min-width: 0; flex: 1; padding-right: 70px; }
  .pl-title { font-size: 26px; font-weight: 800; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-name { font-size: 68px; font-weight: 900; line-height: 1.1; white-space: nowrap; }
  .pl-stripe { position: absolute; left: 0; bottom: 0; width: 900px; height: 14px; }
  .pl-stripe::before, .pl-stripe::after { content: ""; position: absolute; left: 0; height: 7px; transform: skewX(-30deg); transform-origin: left; }
  .pl-stripe::before { top: 0; width: 820px; background: var(--red); }
  .pl-stripe::after { top: 9px; width: 760px; background: var(--gold); }
  .pl-status { position: absolute; left: 190px; top: -46px; height: 46px; padding: 0 22px; background: var(--gold); color: var(--navy);
    font-size: 26px; font-weight: 900; display: flex; align-items: center; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%); padding-right: 34px; }
  .pl-status.out { background: var(--red); color: #fff; }

  /* ── 全体ボード（右） ── */
  #board { right: 40px; top: 130px; width: 560px; background: rgba(16,26,51,.95); border-radius: 18px; padding: 20px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #board.hide { transform: translateX(40px); }
  .bd-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .bd-head b { font-size: 34px; color: var(--gold); }
  .bd-head span { font-size: 20px; color: var(--gray); font-weight: 700; }
  .bd-row { display: flex; align-items: center; height: 40px; border-radius: 8px; padding: 0 12px; gap: 14px; }
  #board.many { width: 860px; }
  #board.many .bd-rows { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; column-gap: 12px; }
  #board.many .bd-row { height: 34px; }
  #board.many .bd-no { font-size: 24px; width: 38px; } #board.many .bd-name { font-size: 22px; } #board.many .bd-st { font-size: 17px; }
  .bd-row:nth-child(odd) { background: rgba(255,255,255,.04); }
  .bd-row.cur { background: rgba(240,180,41,.18); box-shadow: inset 4px 0 0 var(--gold); }
  .bd-row.out { opacity: .45; }
  .bd-no { width: 48px; font-size: 32px; color: var(--gold); text-align: right; }
  .bd-name { flex: 1; font-size: 28px; font-weight: 800; white-space: nowrap; }
  .bd-st { font-size: 22px; font-weight: 800; padding: 4px 12px; border-radius: 6px; background: var(--navy2); color: var(--gray); white-space: nowrap; }
  .bd-st.s2 { color: var(--white); } .bd-st.s3 { color: var(--gold); } .bd-st.sF, .bd-st.sALL { background: var(--gold); color: var(--navy); }
  .bd-st.out { background: transparent; color: var(--red); }

  /* ── 演出バナー ── */
  #fx { left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; display: none; }
  #fx.play { display: block; }
  .fx-band { position: absolute; left: -200px; right: -200px; top: 400px; height: 260px; transform: skewY(-4deg) scaleX(0);
    display: flex; align-items: center; justify-content: center; }
  #fx.play .fx-band { animation: band 2.6s cubic-bezier(.2,.9,.2,1) forwards; }
  .fx-band.b1 { background: var(--red); top: 380px; }
  .fx-band.b2 { background: var(--gold); top: 420px; height: 220px; animation-delay: .08s !important; }
  .fx-text { position: absolute; left: 0; right: 0; top: 420px; height: 220px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; transform: skewY(-4deg); opacity: 0; }
  #fx.play .fx-text { animation: txt 2.6s cubic-bezier(.2,.9,.2,1) forwards; }
  .fx-main { font-size: 180px; line-height: .9; color: var(--navy); letter-spacing: 2px; }
  .fx-sub { font-size: 40px; font-weight: 900; color: var(--navy); margin-top: 6px; }
  #fx.fail .b2 { background: var(--navy); } #fx.fail .b1 { background: var(--red); }
  #fx.fail .fx-main, #fx.fail .fx-sub { color: var(--white); }
  #fx.fail .fx-main { color: var(--red); }
  #fx.big .b1 { background: var(--gold); } #fx.big .b2 { background: var(--red); }
  #fx.big .fx-main, #fx.big .fx-sub { color: var(--white); }
  .fx-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #fx.play .fx-flash { animation: flash .5s; }

  @keyframes band { 0% { transform: skewY(-4deg) scaleX(0); } 14% { transform: skewY(-4deg) scaleX(1); }
    82% { transform: skewY(-4deg) scaleX(1); opacity: 1; } 100% { transform: skewY(-4deg) scaleX(1) translateX(2400px); opacity: 1; } }
  @keyframes txt { 0%, 10% { opacity: 0; transform: skewY(-4deg) scale(1.6); } 20% { opacity: 1; transform: skewY(-4deg) scale(1); }
    80% { opacity: 1; transform: skewY(-4deg) translateX(0); } 100% { opacity: 0; transform: skewY(-4deg) translateX(1600px); } }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: .55; } 100% { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes blink { 50% { border-color: var(--line); } }
</style>
</head>
<body>
  <div id="hud" class="layer"></div>
  <div id="progress" class="layer"></div>
  <div id="player" class="layer"></div>
  <div id="board" class="layer"></div>
  <div id="fx" class="layer">
    <div class="fx-flash"></div>
    <div class="fx-band b1"></div><div class="fx-band b2"></div>
    <div class="fx-text"><div class="fx-main en"></div><div class="fx-sub"></div></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="common.js?v=6"></script>
<script>
  if (new URLSearchParams(location.search).get("bg")) document.body.classList.add("bg");

  // ── 効果音（sfx/ のwavを差し替えれば音を変えられる） ──────────
  const SOUNDS = {};
  for (const n of ["clear", "miss", "stage", "complete", "over", "start", "tick", "tick_last"]) {
    const a = new Audio(`sfx/${n}.wav`);
    a.preload = "auto";
    SOUNDS[n] = a;
  }
  const MUTED = new URLSearchParams(location.search).get("mute");

  function playSfx(name) {
    if (!SFX.on || MUTED || !SOUNDS[name]) return;
    const a = SOUNDS[name].cloneNode();
    a.volume = Math.max(0, Math.min(1, SFX.vol));
    a.play().catch(() => {}); // ブラウザで最初のクリック前は鳴らない（OBSでは鳴る）
  }

  let S = loadState();
  let prev = null; // 前回描画時の状態（ポップ演出の差分用）
  let lastFx = S.fx ? S.fx.t : 0;
  const $ = (id) => document.getElementById(id);

  function renderHud() {
    const ev = evById(S.event), no = S.player;
    const el = $("hud");
    el.classList.toggle("hide", !S.show.hud);
    const head = `<div class="hud-title"><span class="hud-id en">${ev.id === "F" ? "FINAL" : ev.id}</span>
      <span class="hud-name" style="font-size:${ev.name.length > 10 ? 34 : 42}px">${ev.name}</span>${ev.name.length > 10 ? "" : `<span class="hud-kind">${ev.kind}</span>`}</div>`;

    if (ev.final) {
      const f = finState(S, no), ms = finElapsed(f);
      const cls = ms > FINAL_LIMIT_MS ? "over" : ms > FINAL_LIMIT_MS - 10000 ? "warn" : "";
      const st = finStatus(S, no).status;
      el.className = "layer" + (S.show.hud ? "" : " hide") + (st === "clear" ? " st-clear" : st === "fail" ? " st-fail" : "");
      el.innerHTML = head + `
        <div class="fin-wrap"><div class="fin-time en ${cls}" id="finTime">${fmtTime(ms)}</div>
          <div class="fin-score" style="margin-left:auto"><b class="en">${f.score}</b><span class="en">/ ${FINAL_GOAL}</span></div></div>
        <div class="bar time ${cls}"><i id="finBar" style="width:${Math.min(100, ms / FINAL_LIMIT_MS * 100)}%"></i></div>
        <div class="bar"><i style="width:${f.score / FINAL_GOAL * 100}%"></i></div>
        <div class="hud-row"><div class="hud-label">ミス</div>
          <div class="miss-dots">${Array.from({ length: FINAL_MISS_DQ }, (_, i) => i).map((i) => `<div class="dot ${i < f.streak ? "on" : ""}"></div>`).join("")}</div>
          <div class="hud-note ${st === "clear" ? "clear" : st === "fail" ? "fail" : ""}">${
            f.dq ? f.dq : st === "clear" ? "MöSUKE 完全制覇" : st === "fail" ? "失敗" : f.start ? `${FINAL_MISS_DQ}連続で失格` : "スタート待ち"}</div></div>`;
      return;
    }

    const { clears, misses, status } = evStatus(S, no, ev.id);
    const p = prev && prev.player === no && prev.event === ev.id ? evStatus(prev, no, ev.id) : null;
    el.className = "layer" + (S.show.hud ? "" : " hide") + (status === "clear" ? " st-clear" : status === "fail" ? " st-fail" : "");
    const left = ev.miss - misses;
    let note = "", ncls = "";
    if (status === "clear") { note = "CLEAR!"; ncls = "clear"; }
    else if (status === "fail") { note = "ここで敗退"; ncls = "fail"; }
    else if (left === 0) { note = "もうミスできない"; ncls = "warn"; }
    else note = `あと${left}回までOK`;
    el.innerHTML = head + `
      <div class="hud-row"><div class="hud-label">クリア</div><div class="chips">${ev.steps.map((s, i) =>
        `<div class="chip ${i < clears ? "done" : ""} ${p && i === clears - 1 && clears > p.clears ? "pop" : ""}">${s}</div>`).join("")}</div></div>
      <div class="hud-row"><div class="hud-label">ミス</div><div class="miss-dots">${Array.from({ length: ev.miss }, (_, i) =>
        `<div class="dot ${i < misses ? "on" : ""} ${p && i === misses - 1 && misses > p.misses ? "pop" : ""}"></div>`).join("")}</div>
        <div class="hud-note ${ncls}">${note}</div></div>`;
  }

  function renderProgress() {
    const el = $("progress"), no = S.player, cur = evById(S.event);
    el.classList.toggle("hide", !S.show.progress);
    el.innerHTML = `<img src="logo.png" alt="">` + STAGES.map((st, i) => {
      const evs = EVENTS.filter((e) => e.stage === st.key);
      return (i ? `<div class="stg-sep"></div>` : "") + `<div class="stg ${cur.stage === st.key ? "cur" : ""} ${st.key === "F" ? "final" : ""}">
        <div class="stg-name en">${st.short}</div><div class="pips">${evs.map((e) => {
          const s = evStatus(S, no, e.id).status;
          return `<div class="pip ${s === "clear" ? "clear" : s === "fail" ? "fail" : ""} ${e.id === S.event && s !== "clear" && s !== "fail" ? "cur" : ""}"></div>`;
        }).join("")}</div></div>`;
    }).join("");
  }

  function renderPlayer() {
    const el = $("player"), p = playerByNo(S.player), pg = playerProgress(S, p.no);
    el.classList.toggle("hide", !S.show.player);
    el.innerHTML = `<div class="pl-status ${pg.out ? "out" : ""}">${pg.label}</div>
      <div class="pl-box"><div class="pl-no en">${String(p.no).padStart(2, "0")}</div>
        <div class="pl-text">${p.title ? `<div class="pl-title">${p.title}</div>` : ""}<div class="pl-name">${p.name}</div></div></div>
      <div class="pl-stripe"></div>`;
  }

  function renderBoard() {
    const el = $("board");
    el.classList.toggle("hide", !S.show.board);
    el.classList.toggle("many", PLAYERS.length > 14);
    const rows = PLAYERS.map((p) => {
      const pg = playerProgress(S, p.no);
      return `<div class="bd-row ${p.no === S.player ? "cur" : ""} ${pg.out ? "out" : ""}">
        <div class="bd-no en">${String(p.no).padStart(2, "0")}</div><div class="bd-name">${p.name}</div>
        <div class="bd-st ${pg.out ? "out" : "s" + pg.reached}">${pg.label}</div></div>`;
    }).join("");
    const alive = PLAYERS.filter((p) => !playerProgress(S, p.no).out).length;
    el.innerHTML = `<div class="bd-head"><b class="en">PLAYERS</b><span>残り ${alive} / ${PLAYERS.length} 人</span></div><div class="bd-rows" style="grid-template-rows: repeat(${Math.ceil(PLAYERS.length / 2)}, auto)">${rows}</div>`;
  }

  function playFx() {
    if (!S.fx || S.fx.t === lastFx) return;
    lastFx = S.fx.t;
    if (Date.now() - S.fx.t > 4000) return; // 読み込み直後に古い演出を再生しない
    playSfx(S.fx.sfx || { clear: "clear", fail: "miss", stage: "stage", allclear: "complete" }[S.fx.type] || "clear");
    const el = $("fx");
    el.className = "layer " + ({ clear: "", fail: "fail", stage: "big", allclear: "big" }[S.fx.type] || "");
    el.querySelector(".fx-main").textContent = S.fx.text;
    el.querySelector(".fx-sub").textContent = S.fx.sub || "";
    void el.offsetWidth;
    el.classList.add("play");
    clearTimeout(playFx.t);
    playFx.t = setTimeout(() => el.classList.remove("play"), 2700);
  }

  function render() {
    if (!playerByNo(S.player)) S.player = PLAYERS[0].no;
    renderHud(); renderProgress(); renderPlayer(); renderBoard(); playFx();
    prev = JSON.parse(JSON.stringify(S));
  }

  // Finalのタイマーは毎フレーム更新
  let lastStart = 0, lastTick = -1;
  function tick() {
    const ev = evById(S.event);
    if (ev.final) {
      const f = finState(S, S.player);
      if (f.start && f.start !== lastStart) { lastStart = f.start; lastTick = -1; playSfx("start"); }
      if (f.start && !f.stop) {
        const left = Math.ceil((FINAL_LIMIT_MS - finElapsed(f)) / 1000);
        if (left !== lastTick && left <= 10 && left >= 1) { lastTick = left; playSfx(left === 1 ? "tick_last" : "tick"); }
        const ms = finElapsed(f), t = $("finTime"), b = $("finBar");
        if (t) {
          t.textContent = fmtTime(ms);
          const cls = ms > FINAL_LIMIT_MS ? "over" : ms > FINAL_LIMIT_MS - 10000 ? "warn" : "";
          t.className = "fin-time en " + cls;
          b.style.width = Math.min(100, ms / FINAL_LIMIT_MS * 100) + "%";
          b.parentElement.className = "bar time " + cls;
        }
      }
    }
    requestAnimationFrame(tick);
  }

  onState((s) => { S = s; render(); });
  onConfig(() => location.reload());
  document.body.classList.add("hud-" + LAYOUT.hud);
  render();
  requestAnimationFrame(tick);
</script>
</body>
</html>
