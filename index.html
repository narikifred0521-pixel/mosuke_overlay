<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MöSUKE Overlay</title>
<style>
  body { margin: 0; background: #0A1022; color: #F5F6FA; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
  .stage { flex: 1 1 640px; min-width: 0; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #000; }
  .screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
  .ctrl { flex: 0 0 400px; height: calc(100vh - 32px); min-height: 700px; border: 0; border-radius: 10px; }
  h1 { font-size: 15px; color: #8A93AB; font-weight: 700; margin: 0 0 10px; }
  p { font-size: 13px; color: #8A93AB; line-height: 1.8; }
  a { color: #F0B429; }
  @media (max-width: 900px) { .ctrl { flex-basis: 100%; height: 900px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <h1>MöSUKE 配信オーバーレイ — 右の操作パネルを押すと左の画面が動く（市松模様は透過部分）</h1>
    <div class="screen" id="screen"><iframe id="ov" src="overlay.html?bg=1"></iframe></div>
    <p>効果音は、この画面を1回クリックすると鳴るようになる（OBSでは最初から鳴る）。<br>OBS: ブラウザソースに <a href="overlay.html">overlay.html</a>（幅1920・高さ1080）／カスタムドックに <a href="control.html">control.html</a></p>
  </div>
  <iframe class="ctrl" src="control.html"></iframe>
</div>
<script>
  const fit = () => { const s = document.getElementById("screen"); document.getElementById("ov").style.transform = `scale(${s.clientWidth / 1920})`; };
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
